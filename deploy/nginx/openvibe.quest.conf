## ═══════════════════════════════════════════════════════════════
## openvibe.quest — Nginx configuration (REFERENCE)
##
## Deployed to /etc/nginx/sites-available/openvibe.quest.conf (ov-vhost-install) — keep them in sync and reload
## nginx after changing it. The Node app (port 4980, systemd unit openvibe-quest) renders every page and serves
## the API; nginx terminates TLS, redirects www → apex, rate-limits sign-in and the API, and compresses text.
##
## No proxy_cache: the app decides cacheability per response (public for the pages rendered for anonymous
## visitors; private, no-store for everything personal). Never log request bodies here.
## ═══════════════════════════════════════════════════════════════

limit_req_zone $binary_remote_addr zone=quest_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=quest_api:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=quest_forms:10m rate=1r/s;

server {
    listen 80;
    listen [::]:80;
    server_name openvibe.quest www.openvibe.quest;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://openvibe.quest$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.openvibe.quest;

    ssl_certificate     /etc/letsencrypt/live/openvibe.quest/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.quest/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    return 301 https://openvibe.quest$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name openvibe.quest;

    ssl_certificate     /etc/letsencrypt/live/openvibe.quest/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.quest/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/openvibe.quest.access.log;
    error_log  /var/log/nginx/openvibe.quest.error.log;

    # The API's JSON body cap is 64 KB; leave room for the headers.
    client_max_body_size 128k;

    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json application/problem+json image/svg+xml text/plain application/xml;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ── Network SSO session endpoints ───────────────────────
    # The navbar's session probe runs on every page view: it gets the API's budget, not sign-in's.
    location = /auth/me {
        limit_req zone=quest_api burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:4980;
    }

    location /auth/ {
        limit_req zone=quest_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:4980;
    }

    # ── API ─────────────────────────────────────────────────
    location /api/ {
        limit_req zone=quest_api burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:4980;
    }

    # ── Forms and other writes ──────────────────────────────
    location ~ ^/forms {
        limit_req zone=quest_forms burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:4980;
    }

    # ── Prometheus metrics: host-local scrapers only (http://127.0.0.1:4980/metrics) ──
    location = /metrics { return 404; }

    # ── OpenVibe.Events' delivery route: loopback only (POST /internal/events) ──
    # Events posts to http://127.0.0.1:4980/internal/events directly. Never proxied from outside; and because
    # every proxied request here carries X-Forwarded-For, a delivery that did come through nginx would be
    # refused by the consumer anyway (server/events-consumer.js).
    location /internal/ { return 404; }

    # ── Pages, docs, robots.txt, sitemap, static assets ─────
    location / {
        proxy_pass http://127.0.0.1:4980;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
